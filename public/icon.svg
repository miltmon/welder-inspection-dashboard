<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="76"/>

  <!-- Welding torch/tool icon -->
  <g stroke="#f97316" stroke-width="15" fill="none">
    <!-- Main circle -->
    <circle cx="256" cy="256" r="80"/>

    <!-- Cross inside circle -->
    <line x1="200" y1="256" x2="312" y2="256"/>
    <line x1="256" y1="200" x2="256" y2="312"/>
  </g>

  <!-- CM text -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#ffffff">CM</text>

  <!-- Subtitle -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#94a3b8">Inspection</text>
</svg>
